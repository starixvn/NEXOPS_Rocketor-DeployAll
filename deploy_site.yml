---
-   name: Deploy Rocketor Site
    hosts: all
    vars:
        root_build_path: 'D:\Builds'
        org_name: nexcel #luminet
        source_folder: "{{root_build_path}}\\Compiled\\NEXOPS\\Rocketor\\Site_{{org_name}}"
        dest_folder: 'D:\Tools\Rocketor\Rocketor-UAT'
        transform_config_name: '.UAT'        
        site_name: Rocketor.Site
    
    tasks:
        -   name: Include task - Clean and prepare source folder
            include_tasks: tasks/clean_prepare_folder.yml
        
        -   name: Copy deployment files to host
            win_copy:
                src: "_deploy/site_{{org_name}}/"
                dest: '{{source_folder}}'

        -   name: Transform Web.AppSettings.config
            win_copy:
                src: "{{source_folder}}\\Web.AppSettings{{transform_config_name}}.config"
                dest: "{{source_folder}}\\Web.AppSettings.config"
                remote_src: true 

        -   name: Transform Web.config
            win_copy:
                src: "{{source_folder}}\\Web{{transform_config_name}}.config"
                dest: "{{source_folder}}\\Web.config"
                remote_src: true 
        
        -   name: Include task - Deploy Site
            include_tasks: tasks/deploy.yml

        -   name: Recycle Site
            win_shell: "C:\\Windows\\system32\\inetsrv\\appcmd recycle apppool {{site_name}}"