---
-   name: Deploy Rocketor site
    hosts: all
    vars:
        root_build_path: D:\Builds
        source_folder: "{{root_build_path}}\\Compiled\\NEXOPS\\Rocketor\\Site"
        site_folder: D:\Tools\Rocketor\Rocketor-UAT
        transform_config_name: .UAT
    
    tasks:
        -   name: Delete all files and sub folders if source folder exists
            win_file:
                path: {{source_folder}}
                state: absent

        -   name: Create if source folder not exist
            win_file:
                path: {{source_folder}}
                state: directory
        
        -   name: Copy deployment files to host
            win_copy:
                src: _deploy/site/
                dest: {{source_folder}}

        -   name: Transform Web.AppSettings.config
            win_copy:
                src: "{{source_folder}}\\Web.AppSettings{{transform_config_name}}.config"
                dest: "{{source_folder}}\\Web.AppSettings.config"
                remote_src: true 

        -   name: Transform Web.config
            win_copy:
                src: "{{source_folder}}\\Web{{transform_config_name}}.config"
                dest: "{{source_folder}}\\Web.config"
                remote_src: true 
        
        -   name: Deploy site
            win_robocopy:
                src: {{source_folder}}
                dest: {{site_folder}}
                recurse: yes
                purge: yes
        
        

