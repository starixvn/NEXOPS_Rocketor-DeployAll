---
-   name: Deploy Rocketor Build Service Linux
    hosts: all
    vars:
        transform_config_name: '.UAT'
        source_folder: '_deploy/build_service_linux'
        dest_folder: '/var/www/Rocketor.BuildService.Linux'
        service_name: Rocketor.BuildService.Linux.service
    
    tasks:        
        -   name: Transform appsettings.json
            copy:
                src: "{{source_folder}}/appsettings{{transform_config_name}}.json"
                dest: "{{source_folder}}/appsettings.json"
            delegate_to: localhost

        -   name: Deploy Build Service Linux
            synchronize:
                src: '{{source_folder}}/'
                dest: '{{dest_folder}}'
                checksum: yes 
                delete: yes
                recursive: yes

        -   name: Set permission mode 0755
            file:
                path: '{{dest_folder}}'
                state: directory
                mode: '0755'
                recurse: yes

        -   name: Restart Build Service Linux
            service:
                name: '{{service_name}}'
                state: restarted   
                
        -   name: Populate service facts
            service_facts: 
        -   debug:
                var: ansible_facts.services['{{service_name}}']
        