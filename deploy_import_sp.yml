---
-   name: Deploy Rocketor ImportSPData
    hosts: all
    vars:
        root_build_path: 'D:\Builds'        
        dest_folder: 'D:\Tools\Rocketor\Rocketor.ImportSpData'
        transform_config_name: '.UAT'
        scheduled_task_name: Rocketor.ImportSpData
        source_folder: "{{root_build_path}}\\Compiled\\NEXOPS\\Rocketor\\ImportSPData"
        executable_name: Fanex.Rocketor.ImportSPData
        executable_file: '{{executable_name}}.exe'
    
    tasks:
        -   name: Include task - Clean and prepare source folder
            include_tasks: tasks/clean_prepare_folder.yml
        
        -   name: Copy deployment files to host
            win_copy:
                src: _deploy/import_sp_to_ndict/
                dest: '{{source_folder}}'

        -   name: 'Transform {{executable_file}}.config'
            win_copy:
                src: "{{source_folder}}\\{{executable_file}}{{transform_config_name}}.config"
                dest: "{{source_folder}}\\{{executable_file}}.config"
                remote_src: true

        -   name: Stop ImportSPData
            win_command: 'taskkill.exe /IM {{executable_file}} /F /T'

        -   name: Wait for ImportSPData to be stopped
            win_wait_for_process:
                process_name_exact: '{{executable_name}}'
                state: absent
                timeout: 10
                sleep: 1
        
        -   name: Include task - Deploy ImportSPData
            include_tasks: tasks/deploy.yml

        -   name: Start ImportSPData
            win_command: 'schtasks /run /tn {{scheduled_task_name}}'

        -   name: Wait for ImportSPData to be started
            win_wait_for_process:
                process_name_exact: '{{executable_name}}'
                state: present
                timeout: 5
                sleep: 1

        